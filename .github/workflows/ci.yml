name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements-base.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-base.txt pytest>=8.3.0

      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          cp server/.env.example server/.env

      - name: Run Pytest Suite
        env:
          TELEGRAM_BOT_TOKEN: "123456789:TEST_MOCK_TOKEN_CI_PASSING"
          NGROK_AUTH_TOKEN: "test_ngrok_token_ci_passing"
          GEMINI_API_KEYS: "test_key_1,test_key_2"
          KALISTENIKA_DIR: "./kalistenika"
        run: |
          pytest server/ -v
